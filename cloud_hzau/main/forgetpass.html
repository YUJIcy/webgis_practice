<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="//at.alicdn.com/t/c/font_4729834_7ck8w7f20qa.css">
    <link rel="stylesheet" href="./loginstyle.css">
</head>
<body>
    <div class="wrapper">
        <form method="post" action="http://localhost:8080">
            <div class="title">
                <img src="https://cas.hzau.edu.cn/cas/assets/themes/simply/replace_it/logo-app.png" alt="">
            </div>
            <h2>忘记密码</h2>
            <div class="input-box">
                <div class="icon"><i class="iconfont icon-yonghu"></i></div>
                <input type="text" name="userName" placeholder="请输入用户名" autocomplete="on">
            </div>
            <div class="input-box">
                <div class="icon"><i class="iconfont icon-youxiang"></i></div>
                <input type="text" name="userPost" placeholder="请输入邮箱" autocomplete="on">
            </div>
            <div class="remember-forget">
                <label>
                    <input type="checkbox"> 确保邮箱正确
                </label>
            </div>
            <button type="submit" class="btn">发送邮件</button>
            <div class="register-link">
                <a href="signup.html">用户注册</a>
            </div>
        </form>
    </div>
    
</body>
</html>
